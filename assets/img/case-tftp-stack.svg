<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TFTP_VLAN protocol stack</title>
  <desc id="desc">A hand-written stack from pcap frames through Ethernet, 802.1Q, IPv4, UDP and TFTP, with no operating-system network stack beneath it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#201e1d"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ec3013"/>
    </marker>
    <style>
      .bg { fill: #f3f2f2; }
      .ink { fill: #201e1d; }
      .muted { fill: #605d5d; }
      .accent { fill: #ec3013; }
      .box { fill: none; stroke: #201e1d; stroke-width: 2; }
      .box-accent { fill: #fff2ef; stroke: #ec3013; stroke-width: 2; }
      .box-dark { fill: #201e1d; stroke: #201e1d; }
      .line { stroke: #201e1d; stroke-width: 2; fill: none; }
      .line-soft { stroke: #9b9797; stroke-width: 1.5; fill: none; }
      .line-accent { stroke: #ec3013; stroke-width: 2.5; fill: none; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #201e1d; letter-spacing: -1px; }
      .kicker { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #ae1800; letter-spacing: 2px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #201e1d; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #605d5d; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #201e1d; }
      .white { fill: #f3f2f2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="kicker" x="60" y="58">CASE 03 — TFTP_VLAN</text>
  <text class="title" x="60" y="98">Every layer is in-process</text>
  <text class="small" x="60" y="126">2025 · C · pcap raw frames · no OS network stack</text>

  <rect class="box-accent" x="70" y="170" width="390" height="100"/>
  <text class="kicker" x="94" y="198">APPLICATION</text>
  <text class="label" x="94" y="228">TFTP server</text>
  <text class="small" x="94" y="258">RFC 1350 + options 2348/2349/7440</text>

  <rect class="box" x="70" y="282" width="390" height="82"/>
  <text class="kicker" x="94" y="310">TRANSPORT</text>
  <text class="label" x="94" y="340">UDP</text>
  <text class="small" x="260" y="340">checksum over pseudo-header</text>

  <rect class="box" x="70" y="394" width="390" height="82"/>
  <text class="kicker" x="94" y="422">NETWORK</text>
  <text class="label" x="94" y="452">IPv4</text>
  <text class="small" x="260" y="452">transmit-side fragmentation</text>

  <rect class="box" x="70" y="506" width="390" height="82"/>
  <text class="kicker" x="94" y="534">LINK</text>
  <text class="label" x="94" y="564">Ethernet + 802.1Q</text>

  <line class="line-accent" x1="400" y1="506" x2="400" y2="480" marker-end="url(#arrow-accent)"/>
  <line class="line-accent" x1="400" y1="394" x2="400" y2="368" marker-end="url(#arrow-accent)"/>
  <line class="line-accent" x1="400" y1="282" x2="400" y2="274" marker-end="url(#arrow-accent)"/>
  <text class="small" x="278" y="490">parse / build</text>

  <rect class="box-dark" x="550" y="506" width="280" height="82"/>
  <text class="label" x="574" y="540" fill="#f3f2f2">pcap raw frame</text>
  <text class="small" x="574" y="566" style="fill:#bab6b6">capture point</text>
  <line class="line" x1="550" y1="547" x2="468" y2="547" marker-end="url(#arrow)"/>

  <rect class="box" x="550" y="170" width="560" height="120"/>
  <text class="kicker" x="574" y="200">IN-PROCESS SIDE PROTOCOLS</text>
  <text class="label" x="574" y="234">ARP and ICMP are answered here</text>
  <text class="small" x="574" y="260">The server answers ARP and ping itself; no host network stack is involved.</text>

  <rect class="box" x="550" y="330" width="560" height="120"/>
  <text class="kicker" x="574" y="360">FAILURE RULE</text>
  <text class="label" x="574" y="394">Reject at the earliest provable layer</text>
  <text class="small" x="574" y="420">Malformed frames are discarded before the next parser sees them.</text>

  <g>
    <rect class="box" x="550" y="620" width="250" height="54"/>
    <text class="small" x="570" y="652">office standard across racks</text>
  </g>
  <g>
    <rect class="box" x="830" y="620" width="280" height="54"/>
    <text class="small" x="850" y="652">pcap frame capture</text>
  </g>

  <line class="line-soft" x1="60" y1="600" x2="1140" y2="600"/>
  <text class="small" x="60" y="690">Conceptual stack diagram — the point is the absence of a socket layer beneath the server, not a literal call graph.</text>
</svg>

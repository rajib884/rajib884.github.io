<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TFTP_VLAN topology</title>
  <desc id="desc">Three user switches connect through a breakout switch trunk to one high-config PC; Npcap feeds vlan_tftp.exe, which serves TFTP without the Windows socket stack.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#201e1d"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ec3013"/>
    </marker>
    <style>
      .bg { fill: #f3f2f2; }
      .ink { fill: #201e1d; }
      .muted { fill: #605d5d; }
      .accent { fill: #ec3013; }
      .box { fill: none; stroke: #201e1d; stroke-width: 2; }
      .box-accent { fill: #fff2ef; stroke: #ec3013; stroke-width: 2; }
      .box-soft { fill: #eae9e9; stroke: #9b9797; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .box-dark { fill: #201e1d; stroke: #201e1d; }
      .line { stroke: #201e1d; stroke-width: 2; fill: none; }
      .line-accent { stroke: #ec3013; stroke-width: 2.5; fill: none; }
      .line-soft { stroke: #9b9797; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #201e1d; letter-spacing: -1px; }
      .kicker { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #ae1800; letter-spacing: 2px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #201e1d; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #605d5d; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #201e1d; }
      .white { fill: #f3f2f2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="kicker" x="60" y="58">CASE 03 &#183; TFTP_VLAN / TOPOLOGY</text>
  <text class="title" x="60" y="98">One trunk, every VLAN</text>
  <text class="small" x="60" y="126">Three user switches share one host NIC; the breakout trunk carries every VLAN ID to the custom TFTP process.</text>

  <text class="kicker" x="60" y="172">USER SWITCHES</text>

  <rect class="box" x="60" y="190" width="210" height="70"/>
  <text class="label" x="80" y="220">User 1</text>
  <text class="mono" x="80" y="244" fill="#ec3013">VLAN 10</text>

  <rect class="box" x="60" y="280" width="210" height="70"/>
  <text class="label" x="80" y="310">User 2</text>
  <text class="mono" x="80" y="334" fill="#ec3013">VLAN 20</text>

  <rect class="box" x="60" y="370" width="210" height="70"/>
  <text class="label" x="80" y="400">User 3</text>
  <text class="mono" x="80" y="424" fill="#ec3013">VLAN 30</text>

  <rect class="box" x="370" y="174" width="270" height="330"/>
  <text class="label" x="390" y="204">Breakout switch</text>
  <text class="small" x="390" y="224">one access port per user VLAN</text>

  <rect class="box" x="390" y="240" width="120" height="42"/>
  <text class="mono" x="404" y="266">access 10</text>

  <rect class="box" x="390" y="304" width="120" height="42"/>
  <text class="mono" x="404" y="330">access 20</text>

  <rect class="box" x="390" y="368" width="120" height="42"/>
  <text class="mono" x="404" y="394">access 30</text>

  <rect class="box-accent" x="520" y="430" width="100" height="44"/>
  <text class="mono" x="534" y="450" fill="#ec3013">trunk</text>
  <text class="small" x="534" y="466">all VLANs</text>

  <path class="line" d="M270 225 H330 V261 H390" marker-end="url(#arrow)"/>
  <path class="line" d="M270 315 H330 V325 H390" marker-end="url(#arrow)"/>
  <path class="line" d="M270 405 H330 V389 H390" marker-end="url(#arrow)"/>

  <rect class="box" x="760" y="150" width="380" height="380"/>
  <text class="label" x="780" y="182">High-config PC</text>
  <text class="small" x="780" y="202">GNS3 lab host</text>

  <rect class="box-soft" x="780" y="220" width="340" height="48"/>
  <text class="small" x="800" y="249">GNS3 users and virtual switches</text>

  <rect class="box" x="780" y="290" width="150" height="80"/>
  <text class="label" x="800" y="322">Npcap</text>
  <text class="small" x="800" y="344">raw frames</text>

  <rect class="box-accent" x="960" y="290" width="160" height="80"/>
  <text class="label" x="980" y="322">vlan_tftp.exe</text>
  <text class="small" x="980" y="344">parse / respond</text>

  <rect class="box-soft" x="780" y="420" width="340" height="80"/>
  <text class="label" x="800" y="450">Windows socket stack</text>
  <text class="small" x="800" y="474">bypassed &#8212; no socket layer</text>
  <line class="line-accent" x1="1070" y1="438" x2="1100" y2="482"/>
  <line class="line-accent" x1="1100" y1="438" x2="1070" y2="482"/>

  <path class="line" d="M640 452 H700 V330 H780" marker-end="url(#arrow)"/>
  <rect class="box-accent" x="672" y="440" width="58" height="20"/>
  <text class="small" x="682" y="454" fill="#ec3013">802.1Q</text>
  <text class="small" x="650" y="428">trunk to host NIC</text>

  <line class="line" x1="930" y1="318" x2="960" y2="318" marker-end="url(#arrow)"/>
  <line class="line-accent" x1="960" y1="348" x2="930" y2="348" marker-end="url(#arrow-accent)"/>
  <text class="small" x="880" y="382">tagged reply</text>

  <rect class="box" x="60" y="545" width="520" height="105"/>
  <text class="kicker" x="84" y="574">VLAN NORMALIZATION</text>
  <text class="label" x="84" y="602">Tagged: keep the VLAN ID</text>
  <text class="small" x="84" y="626">Untagged: sentinel TCI 0xFFFF. One parser and one session table for both.</text>

  <rect class="box" x="610" y="545" width="530" height="105"/>
  <text class="kicker" x="634" y="574">WHY THE OS PATH FAILS</text>
  <text class="label" x="634" y="602">Windows strips or drops tagged frames</text>
  <text class="small" x="634" y="626">A virtual interface per VLAN does not scale in a dynamic GNS3 lab.</text>

  <line class="line-soft" x1="60" y1="672" x2="1140" y2="672"/>
  <text class="small" x="60" y="698">Logical topology redrawn from the TFTP_VLAN design notes. No vendor hardware or logos.</text>
</svg>

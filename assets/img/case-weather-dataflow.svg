<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">IoT weather station data flow</title>
  <desc id="desc">A left-to-right data path from an anemometer step through the AVR count and I2C payload to the ESP32, display, SD card, Django back end and browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#201e1d"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ec3013"/>
    </marker>
    <style>
      .bg { fill: #f3f2f2; }
      .ink { fill: #201e1d; }
      .muted { fill: #605d5d; }
      .accent { fill: #ec3013; }
      .box { fill: none; stroke: #201e1d; stroke-width: 2; }
      .box-accent { fill: #fff2ef; stroke: #ec3013; stroke-width: 2; }
      .line { stroke: #201e1d; stroke-width: 2; fill: none; }
      .line-accent { stroke: #ec3013; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; }
      .line-soft { stroke: #9b9797; stroke-width: 1.5; fill: none; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #201e1d; letter-spacing: -1px; }
      .kicker { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #ae1800; letter-spacing: 2px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #201e1d; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #605d5d; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #201e1d; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #f3f2f2; }
      .white { fill: #f3f2f2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="kicker" x="60" y="58">CASE 02 — DATA FLOW</text>
  <text class="title" x="60" y="98">From a sensor step to a browser</text>
  <text class="small" x="60" y="126">One reading, nine hand-offs</text>

  <g>
    <rect class="box" x="60" y="190" width="230" height="110"/>
    <circle class="accent" cx="86" cy="216" r="14"/><text class="num" x="82" y="221">1</text>
    <text class="label" x="112" y="222" font-size="15">Anemometer</text>
    <text class="small" x="112" y="248">45&#176; step</text>
    <text class="small" x="112" y="270">past an IR sensor</text>
  </g>

  <g>
    <rect class="box-accent" x="340" y="190" width="230" height="110"/>
    <circle class="accent" cx="366" cy="216" r="14"/><text class="num" x="362" y="221">2</text>
    <text class="label" x="392" y="222" font-size="15">AVR counter</text>
    <text class="small" x="392" y="248">polls three IR sensors</text>
    <text class="small" x="392" y="270">counts 45&#176; steps</text>
  </g>

  <g>
    <rect class="box" x="620" y="190" width="230" height="110"/>
    <circle class="accent" cx="646" cy="216" r="14"/><text class="num" x="642" y="221">3</text>
    <text class="label" x="670" y="222" font-size="15">16-bit total</text>
    <text class="small" x="646" y="248">packed into the</text>
    <text class="small" x="646" y="270">I2C payload</text>
  </g>

  <g>
    <rect class="box" x="900" y="190" width="240" height="110"/>
    <circle class="accent" cx="926" cy="216" r="14"/><text class="num" x="922" y="221">4</text>
    <text class="label" x="952" y="222" font-size="15">ESP32 read</text>
    <text class="small" x="952" y="248">wind count beside</text>
    <text class="small" x="952" y="270">BMP180 + DHT11</text>
  </g>

  <line class="line" x1="290" y1="245" x2="332" y2="245" marker-end="url(#arrow)"/>
  <line class="line" x1="570" y1="245" x2="612" y2="245" marker-end="url(#arrow)"/>
  <line class="line-accent" x1="850" y1="245" x2="892" y2="245" marker-end="url(#arrow-accent)"/>

  <path class="line-accent" d="M1020 300 L 1020 410 L 162 410 L 162 432" marker-end="url(#arrow-accent)"/>
  <path class="line-accent" d="M1020 410 L 397 410 L 397 432" marker-end="url(#arrow-accent)"/>
  <path class="line-accent" d="M1020 410 L 632 410 L 632 432" marker-end="url(#arrow-accent)"/>
  <text class="small" x="400" y="396">three outputs from the same reading</text>

  <g>
    <rect class="box" x="60" y="440" width="205" height="110"/>
    <circle class="accent" cx="86" cy="466" r="14"/><text class="num" x="82" y="471">5</text>
    <text class="label" x="112" y="472" font-size="15">TFT display</text>
    <text class="small" x="112" y="498">SPI, guarded</text>
    <text class="small" x="112" y="520">by a mutex</text>
  </g>

  <g>
    <rect class="box" x="295" y="440" width="205" height="110"/>
    <circle class="accent" cx="321" cy="466" r="14"/><text class="num" x="317" y="471">6</text>
    <text class="label" x="347" y="472" font-size="15">SD card</text>
    <text class="small" x="347" y="498">SPI logging</text>
    <text class="small" x="347" y="520">on the node</text>
  </g>

  <g>
    <rect class="box" x="530" y="440" width="205" height="110"/>
    <circle class="accent" cx="556" cy="466" r="14"/><text class="num" x="552" y="471">7</text>
    <text class="label" x="582" y="472" font-size="15">Wi-Fi publish</text>
    <text class="small" x="582" y="498">ESP32 to the</text>
    <text class="small" x="582" y="520">Django service</text>
  </g>

  <g>
    <rect class="box" x="765" y="440" width="205" height="110"/>
    <circle class="accent" cx="791" cy="466" r="14"/><text class="num" x="787" y="471">8</text>
    <text class="label" x="817" y="472" font-size="15">REST + WS</text>
    <text class="small" x="817" y="498">Django API and</text>
    <text class="small" x="817" y="520">live WebSocket</text>
  </g>

  <g>
    <rect class="box" x="1000" y="440" width="140" height="110"/>
    <circle class="accent" cx="1026" cy="466" r="14"/><text class="num" x="1022" y="471">9</text>
    <text class="label" x="1052" y="472" font-size="15">Browser</text>
    <text class="small" x="1052" y="498">live readings</text>
  </g>

  <line class="line-accent" x1="735" y1="495" x2="757" y2="495" marker-end="url(#arrow-accent)"/>
  <line class="line" x1="970" y1="495" x2="992" y2="495" marker-end="url(#arrow)"/>

  <line class="line-soft" x1="60" y1="640" x2="1140" y2="640"/>
  <text class="small" x="60" y="672">The AVR side is the count-and-byte-packing half; the ESP32 side is MicroPython. The diagram follows the verified project description, not a pinout.</text>
</svg>
